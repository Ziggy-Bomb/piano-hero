<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8fd3ff">
<link rel="manifest" href="./manifest.webmanifest">
<title>Little Pilot</title>
</head>
<body>
<style>
  html,body{margin:0;padding:0;position:fixed;inset:0;overflow:hidden;background:#8fd3ff;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    touch-action:none;overscroll-behavior:none}
  #cv{position:absolute;inset:0;display:block;touch-action:none}
  .hbtn{position:absolute;z-index:6;border:none;touch-action:none;padding:0}
  #mute{top:10px;left:10px;width:42px;height:42px;border-radius:50%;
    background:rgba(255,255,255,.4);font-size:20px;opacity:.85}
  #mute:active{transform:scale(.92)}
  .big{position:absolute;left:50%;transform:translateX(-50%);z-index:6;border:none;
    background:#ffd23f;color:#4a3608;font-weight:900;letter-spacing:.04em;
    font-size:clamp(22px,6vmin,30px);padding:18px 52px;border-radius:52px;
    box-shadow:0 6px 0 #c99a12,0 12px 22px rgba(0,0,0,.3);touch-action:none;display:none}
  .big:active{transform:translateX(-50%) translateY(4px);box-shadow:0 2px 0 #c99a12}
  #playBtn{bottom:13%}
  #nextBtn{bottom:10%;background:#7ede63;box-shadow:0 6px 0 #3f9a2b,0 12px 22px rgba(0,0,0,.3)}
  #nextBtn:active{box-shadow:0 2px 0 #3f9a2b}
  .chip{position:absolute;z-index:6;border:none;background:rgba(0,0,0,.18);color:#fff;
    font-size:13px;font-weight:700;padding:8px 14px;border-radius:18px;display:none;touch-action:none}
  #freeBtn{bottom:12px;left:12px}
  #resetBtn{bottom:12px;right:12px}
</style>
<canvas id="cv"></canvas>
<button class="hbtn" id="mute" aria-label="Sound on or off">&#128266;</button>
<button class="big" id="playBtn">PLAY &#9654;</button>
<button class="big" id="nextBtn">NEXT &#9654;</button>
<button class="chip" id="freeBtn">&#9992; free fly</button>
<button class="chip" id="resetBtn">start over</button>
<script>
'use strict';
// Little Pilot — Oscar's airport. Land each aircraft, then drag it along the
// ground and park it in its own space (the space shows a ghost of who lives
// there — big spaces for big planes, little spaces for little ones). Twelve
// levels, more planes in the sky as you go, and nothing can ever go wrong.
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rand=(a,b)=>a+Math.random()*(b-a);
const dist=(x1,y1,x2,y2)=>Math.hypot(x2-x1,y2-y1);
const lerp=(a,b,k)=>a+(b-a)*k;
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
function makeRng(seed){let s=seed*9301+49297;return()=>{s=(s*9301+49297)%233280;return s/233280;};}

// ------------------------------------------------------------- audio + voice
const A={
  ctx:null,g:null,nbuf:null,muted:store.get('lp_mute',false),
  init(){if(this.ctx)return;
    try{
      const C=window.AudioContext||window.webkitAudioContext;
      this.ctx=new C();
      this.g=this.ctx.createGain();
      this.g.gain.value=this.muted?0:0.55;
      this.g.connect(this.ctx.destination);
      const b=this.ctx.createBuffer(1,this.ctx.sampleRate,this.ctx.sampleRate);
      const d=b.getChannelData(0);
      for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
      this.nbuf=b;
    }catch(e){}
  },
  resume(){this.init();if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},
  setMute(v){this.muted=v;if(this.g)this.g.gain.value=v?0:0.55;store.set('lp_mute',v);
    if(v)try{speechSynthesis.cancel()}catch(e){}},
  tone(f,o){o=o||{};if(!this.ctx||this.muted)return;
    const t0=this.ctx.currentTime+(o.t||0),dur=o.dur||0.3;
    const osc=this.ctx.createOscillator(),g=this.ctx.createGain();
    osc.type=o.type||'triangle';osc.frequency.setValueAtTime(f,t0);
    if(o.slide)osc.frequency.exponentialRampToValueAtTime(Math.max(40,o.slide),t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(o.v||0.2,t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    osc.connect(g);g.connect(this.g);osc.start(t0);osc.stop(t0+dur+0.05);
  },
  noise(o){o=o||{};if(!this.ctx||this.muted||!this.nbuf)return;
    const t0=this.ctx.currentTime+(o.t||0),dur=o.dur||0.3;
    const src=this.ctx.createBufferSource();src.buffer=this.nbuf;src.loop=true;
    const f=this.ctx.createBiquadFilter();f.type='lowpass';
    f.frequency.setValueAtTime(o.f0||1000,t0);
    f.frequency.exponentialRampToValueAtTime(o.f1||200,t0+dur);
    const g=this.ctx.createGain();
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(o.v||0.2,t0+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    src.connect(f);f.connect(g);g.connect(this.g);src.start(t0);src.stop(t0+dur+0.05);
  },
  pent:[523,587,659,784,880,1047,1175,1319],
  note(){this.tone(this.pent[(Math.random()*this.pent.length)|0],{dur:.45,v:.18});},
  honk(){this.tone(340,{dur:.1,type:'square',v:.14});this.tone(255,{t:.11,dur:.14,type:'square',v:.14});},
  whoosh(){this.noise({dur:.5,f0:1600,f1:300,v:.16});},
  thud(){this.tone(150,{dur:.12,type:'sine',v:.3});this.noise({dur:.22,f0:700,f1:180,v:.12});},
  snap(){this.tone(660,{dur:.06,type:'square',v:.2});this.tone(880,{t:.06,dur:.12,type:'square',v:.18});
    this.noise({dur:.06,f0:3000,f1:1500,v:.1});},
  uhoh(){this.tone(392,{dur:.18,type:'triangle',v:.16});this.tone(311,{t:.2,dur:.26,type:'triangle',v:.16});},
  putt(){this.tone(110,{dur:.06,type:'sawtooth',v:.1});},
  fanfare(){[523,659,784,1047,1319].forEach((f,i)=>this.tone(f,{t:i*.09,dur:.32,v:.22}));
    this.tone(2093,{t:.5,dur:.4,type:'sine',v:.1});this.tone(2637,{t:.62,dur:.4,type:'sine',v:.08});},
  bigWin(){[523,523,659,784,880,784,1047,1047,1319].forEach((f,i)=>this.tone(f,{t:i*.15,dur:.3,v:.2}));},
  giggle(){this.tone(620,{dur:.12,type:'sine',v:.18,slide:980});this.tone(980,{t:.13,dur:.16,type:'sine',v:.18,slide:700});},
  chirp(){this.tone(1900,{dur:.06,type:'sine',v:.14,slide:2500});this.tone(2200,{t:.09,dur:.07,type:'sine',v:.12,slide:1700});},
  pop(){this.tone(880,{dur:.06,type:'square',v:.12,slide:1400});},
  patter(){for(let i=0;i<3;i++)this.noise({t:i*.09,dur:.05,f0:2500,f1:1200,v:.05});},
  brrr(){for(let i=0;i<6;i++)this.tone(140,{t:i*.05,dur:.045,type:'square',v:.12});},
  bell(){this.tone(880,{dur:.5,v:.16});this.tone(1319,{t:.13,dur:.55,v:.11});},
  zoom(){this.noise({dur:.45,f0:300,f1:2400,v:.17});},
  roarF(){this.tone(210,{dur:.4,type:'sawtooth',v:.2,slide:120});this.tone(660,{t:.38,dur:.25,v:.15});},
  ding(){this.tone(1319,{dur:.4,v:.16});},
  // planes speak their own little language
  babble(n){if(!this.ctx||this.muted)return;
    const k=n||3+((Math.random()*3)|0);
    for(let i=0;i<k;i++){
      const f=460+Math.random()*440;
      this.tone(f,{t:i*0.085,dur:.07,type:'sine',v:.12,slide:f+140+Math.random()*300});
    }
  },
  glug(){this.tone(190+Math.random()*90,{dur:.12,type:'sine',v:.12,slide:130});},
  scrub(){this.noise({dur:.14,f0:2600,f1:1200,v:.06});},
  screech(k){this.noise({dur:.2+.3*k,f0:1800,f1:300,v:.05+.16*k});
    this.tone(950,{dur:.16+.2*k,type:'sine',v:.05+.1*k,slide:480});},
  clunk(){this.tone(140,{dur:.09,type:'sine',v:.16,slide:90});},
  beepbeep(){this.tone(620,{dur:.09,type:'square',v:.13});this.tone(620,{t:.14,dur:.09,type:'square',v:.13});
    this.tone(830,{t:.32,dur:.12,type:'square',v:.11});},
  xylo(i,t){this.tone([392,494,587,659,784,988,1175][clamp(i,0,6)],{t:t||0,dur:.4,type:'triangle',v:.2});},
  engN:null,engG:null,
  setEngine(k){
    if(!this.ctx)return;
    if(!this.engN){
      try{
        this.engN=this.ctx.createOscillator();
        this.engN.type='sawtooth';this.engN.frequency.value=55;
        const f=this.ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=420;
        this.engG=this.ctx.createGain();this.engG.gain.value=0;
        this.engN.connect(f);f.connect(this.engG);this.engG.connect(this.g);
        this.engN.start();
      }catch(e){this.engN=null;return;}
    }
    const t=this.ctx.currentTime;
    const kk=this.muted?0:clamp(k,0,1);
    try{
      this.engG.gain.setTargetAtTime(kk<0.02?0:0.02+kk*0.085,t,0.08);
      this.engN.frequency.setTargetAtTime(55+kk*150,t,0.07);
    }catch(e){}
  },
  // gentle generative background tune, one flavour per sky
  mus:{on:false,next:0,step:0,theme:0},
  MUS:[
    {bpm:76,bass:[131,98,110,98],arp:[523,659,784,1047,880,784,659,587]},
    {bpm:64,bass:[110,87,98,87],arp:[440,554,659,880,740,659,554,494]},
    {bpm:54,bass:[98,82,87,82],arp:[659,784,988,1319,1175,988,784,659]}
  ],
  musicOn(theme){this.init();this.mus.on=true;this.mus.theme=(theme||0)%3;
    if(this.ctx&&this.mus.next<this.ctx.currentTime)this.mus.next=this.ctx.currentTime+0.15;},
  musicTick(){
    if(!this.ctx||this.muted||!this.mus.on)return;
    const M=this.MUS[this.mus.theme],stepDur=60/M.bpm/2;
    while(this.mus.next<this.ctx.currentTime+0.45){
      const s=this.mus.step,t0=Math.max(0,this.mus.next-this.ctx.currentTime);
      if(s%4===0)this.tone(M.bass[((s/4)|0)%4],{t:t0,dur:stepDur*3.4,type:'triangle',v:.05});
      this.tone(M.arp[s%8],{t:t0,dur:stepDur*1.7,type:'sine',v:this.mus.theme===2?.03:.042});
      if(s%16===12)this.tone(M.arp[(s+3)%8]*2,{t:t0,dur:stepDur*2,type:'sine',v:.024});
      this.mus.step++;this.mus.next+=stepDur;
    }
  }
};
function say(txt){
  if(A.muted)return;
  try{
    if(!('speechSynthesis'in window))return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(txt);
    u.lang='en-GB';u.rate=0.92;u.pitch=1.15;
    const vs=speechSynthesis.getVoices();
    const v=vs.find(x=>x.lang&&x.lang.indexOf('en-GB')===0)||vs.find(x=>x.lang&&x.lang.indexOf('en')===0);
    if(v)u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}

// ------------------------------------------------------------- canvas & layout
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=0,H=0,dpr=1,m=320;
const L={};
function computeLayout(){
  L.groundH=clamp(H*0.34,150,380);
  L.gy=H-L.groundH;
  L.rh=clamp(m*0.115,40,88);
  L.ry=L.gy+L.groundH*0.10;
  L.planeY=L.ry+L.rh*0.5;
  L.bayTop=L.ry+L.rh+L.groundH*0.12;
  L.bayY=L.bayTop+L.groundH*0.26;
  L.sun={x:W-m*0.15,y:m*0.15,r:m*0.085};
  L.pl=clamp(m*0.145,56,110);
  L.station={x:clamp(m*0.15,64,W*0.18),y:L.planeY};
}
function resize(){
  W=innerWidth;H=innerHeight;dpr=Math.min(window.devicePixelRatio||1,3);
  m=Math.min(W,H);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  buildScene();
}

// ------------------------------------------------------------- scene
let clouds=[],flowers=[],birds=[],nextBirds=8,sunG=0,stars=[];
let butterflies=[],fireflies=[],wind=0,stationPulse=0;
function buildCritters(){
  butterflies=[];fireflies=[];
  if(themeIdx!==2)for(let i=0;i<2;i++)butterflies.push({
    x:rand(W*0.1,W*0.9),y:rand(L.gy*0.3,L.gy*0.85),ph:rand(0,TAU),
    hue:[330,45,270][i%3],dash:0});
  if(themeIdx===2)for(let i=0;i<7;i++)fireflies.push({
    x:rand(W*0.05,W*0.95),y:rand(L.gy*0.45,L.gy*0.95),ph:rand(0,TAU),pop:0});
}
const FLCOLS=['#ff8ac2','#ffd23f','#fff','#ff9d5c','#c9a0ff'];
function buildScene(){
  computeLayout();
  clouds=[];
  for(let i=0;i<5;i++)clouds.push({
    x:rand(0,W),y:rand(H*0.04,L.gy*0.5),s:rand(m*0.06,m*0.11),
    v:rand(m*0.008,m*0.02),bT:9});
  flowers=[];
  const n=Math.max(5,Math.round(W/110));
  for(let i=0;i<n;i++)flowers.push({
    x:(i+0.5)*W/n+rand(-12,12),y:rand(L.bayY+m*0.09,H-m*0.02),
    s:rand(m*0.018,m*0.028),col:FLCOLS[i%FLCOLS.length],ph:rand(0,TAU),popT:9});
  stars=[];
  for(let i=0;i<26;i++)stars.push({
    x:rand(0,W),y:rand(0,L.gy*0.7),r:rand(m*0.004,m*0.009),ph:rand(0,TAU),tw:0});
}
const THEMES=[
  {skyA:'#7ac9f7',skyB:'#d8f2ff',grA:'#7ed957',grB:'#5cb83f',h1:'#68b84c',h2:'#5fae44',cloud:'#ffffff',sunB:'#ffdf5c',sunS:'#f2b31c',ray:'#ffd23f'},
  {skyA:'#ff9d5c',skyB:'#ffe3b3',grA:'#6fc24e',grB:'#4da337',h1:'#5da844',h2:'#549b3c',cloud:'#fff0dd',sunB:'#ffb347',sunS:'#e8862c',ray:'#ff9d5c'},
  {skyA:'#25325c',skyB:'#4a5d8f',grA:'#4a9440',grB:'#2f7030',h1:'#3f8338',h2:'#377631',cloud:'rgba(255,255,255,.30)',sunB:'#f3f0d8',sunS:'#cfc8a0',ray:'#f3f0d8'}
];
let themeIdx=0;
function drawScene(){
  const T=THEMES[themeIdx],night=themeIdx===2;
  const sk=ctx.createLinearGradient(0,0,0,L.gy);
  sk.addColorStop(0,T.skyA);sk.addColorStop(1,T.skyB);
  ctx.fillStyle=sk;ctx.fillRect(0,0,W,L.gy+2);
  if(night)for(const st of stars){
    ctx.globalAlpha=0.55+0.45*Math.sin(tSec*2+st.ph);
    ctx.fillStyle='#fff8d8';
    ctx.beginPath();ctx.arc(st.x,st.y,st.r,0,TAU);ctx.fill();
    if(st.tw>0){
      ctx.save();ctx.translate(st.x,st.y);ctx.rotate(st.tw*2);
      starPath(ctx,st.r*4*st.tw+st.r);
      ctx.fillStyle='#ffd23f';ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha=1;
  }
  // sun / sleepy moon
  const s=L.sun,gT=sunG>0?sunG:0;
  if(!night){
    ctx.save();ctx.translate(s.x,s.y);
    ctx.rotate(tSec*0.15+(gT>0?gT*6:0));
    ctx.strokeStyle=T.ray;ctx.lineWidth=s.r*0.16;ctx.lineCap='round';
    for(let i=0;i<12;i++){
      ctx.rotate(TAU/12);
      ctx.beginPath();ctx.moveTo(s.r*1.25,0);ctx.lineTo(s.r*(1.55+(i%2)*0.18),0);ctx.stroke();
    }
    ctx.restore();
  }
  ctx.fillStyle=T.sunB;ctx.strokeStyle=T.sunS;ctx.lineWidth=s.r*0.08;
  ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,TAU);ctx.fill();ctx.stroke();
  if(night){
    ctx.fillStyle='rgba(160,150,110,.35)';
    ctx.beginPath();ctx.arc(s.x-s.r*0.35,s.y+s.r*0.28,s.r*0.13,0,TAU);ctx.fill();
    ctx.beginPath();ctx.arc(s.x+s.r*0.42,s.y+s.r*0.05,s.r*0.09,0,TAU);ctx.fill();
  }
  const ink=night?'#8f835c':'#c98a12';
  ctx.strokeStyle=ink;ctx.lineWidth=s.r*0.07;ctx.lineCap='round';
  if(gT>0||night){
    ctx.beginPath();ctx.arc(s.x-s.r*0.34,s.y-s.r*0.1,s.r*0.16,Math.PI*1.15,Math.PI*1.85);ctx.stroke();
    ctx.beginPath();ctx.arc(s.x+s.r*0.34,s.y-s.r*0.1,s.r*0.16,Math.PI*1.15,Math.PI*1.85);ctx.stroke();
  }else{
    ctx.fillStyle=ink;
    ctx.beginPath();ctx.arc(s.x-s.r*0.32,s.y-s.r*0.14,s.r*0.09,0,TAU);ctx.fill();
    ctx.beginPath();ctx.arc(s.x+s.r*0.32,s.y-s.r*0.14,s.r*0.09,0,TAU);ctx.fill();
  }
  ctx.beginPath();ctx.arc(s.x,s.y+s.r*0.15,s.r*(gT>0?0.42:0.3),0.3,Math.PI-0.3);ctx.stroke();
  // clouds
  ctx.fillStyle=T.cloud;
  for(const c of clouds){
    const bs=c.bT<0.5?1+Math.sin(c.bT*Math.PI)*0.16:1;
    ctx.save();ctx.translate(c.x,c.y);ctx.scale(bs,bs);
    ctx.beginPath();
    ctx.arc(-c.s*0.7,0,c.s*0.52,0,TAU);
    ctx.arc(0,-c.s*0.28,c.s*0.66,0,TAU);
    ctx.arc(c.s*0.72,0,c.s*0.5,0,TAU);
    ctx.arc(0,c.s*0.12,c.s*0.6,0,TAU);
    ctx.fill();
    ctx.restore();
  }
  // hills + ground
  ctx.fillStyle=T.h1;
  ctx.beginPath();ctx.ellipse(W*0.2,L.gy+m*0.05,W*0.42,m*0.13,0,Math.PI,TAU);ctx.fill();
  ctx.fillStyle=T.h2;
  ctx.beginPath();ctx.ellipse(W*0.82,L.gy+m*0.06,W*0.38,m*0.16,0,Math.PI,TAU);ctx.fill();
  const gr=ctx.createLinearGradient(0,L.gy,0,H);
  gr.addColorStop(0,T.grA);gr.addColorStop(1,T.grB);
  ctx.fillStyle=gr;ctx.fillRect(0,L.gy,W,L.groundH);
  // runway
  ctx.fillStyle='#5b6770';
  ctx.beginPath();ctx.roundRect(-20,L.ry,W+40,L.rh,10);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=Math.max(2,L.rh*0.05);
  ctx.beginPath();ctx.moveTo(0,L.ry+L.rh*0.07);ctx.lineTo(W,L.ry+L.rh*0.07);
  ctx.moveTo(0,L.ry+L.rh*0.93);ctx.lineTo(W,L.ry+L.rh*0.93);ctx.stroke();
  ctx.strokeStyle='#ffd23f';ctx.lineWidth=Math.max(3,L.rh*0.09);
  ctx.setLineDash([L.rh*0.55,L.rh*0.45]);
  ctx.beginPath();ctx.moveTo(0,L.ry+L.rh*0.5);ctx.lineTo(W,L.ry+L.rh*0.5);ctx.stroke();
  ctx.setLineDash([]);
  const step=Math.max(60,W/12);
  for(let x=step/2;x<W;x+=step){
    if(night){
      ctx.fillStyle='rgba(255,236,138,.28)';
      ctx.beginPath();ctx.arc(x,L.ry-4,9,0,TAU);ctx.fill();
    }
    ctx.fillStyle='#ffec8a';
    ctx.beginPath();ctx.arc(x,L.ry-4,3.2,0,TAU);ctx.fill();
  }
  // flowers
  for(const f of flowers){
    const sway=Math.sin(tSec*1.6+f.ph)*0.12;
    const pk=f.popT<1?f.popT:1;
    const sc=pk<1?pk*pk:1;
    if(sc<=0.02)continue;
    ctx.save();ctx.translate(f.x,f.y);ctx.rotate(sway);ctx.scale(sc,sc);
    ctx.strokeStyle='#3f8f2e';ctx.lineWidth=f.s*0.22;
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-f.s*1.4);ctx.stroke();
    ctx.fillStyle=f.col;
    for(let i=0;i<6;i++){
      const a=i*TAU/6+sway;

  }
  // birds
  ctx.strokeStyle=night?'#c9d2de':'#3c4650';ctx.lineCap='round';
  for(const b of birds){
    const flap=Math.sin(tSec*10+b.ph)*0.5;
    ctx.lineWidth=Math.max(2,m*0.008);
    ctx.beginPath();
    ctx.moveTo(b.x-m*0.02,b.y-flap*m*0.012);
    ctx.quadraticCurveTo(b.x-m*0.008,b.y+m*0.008,b.x,b.y);

  ctx.fillStyle=night?'#8fa3c9':'#bfe9ff';
  ctx.beginPath();ctx.roundRect(twx-m*0.026,twy-m*0.135,m*0.052,m*0.038,m*0.01);ctx.fill();ctx.stroke();
  ctx.save();ctx.translate(twx,twy-m*0.145);ctx.rotate(tSec*1.4);
  ctx.strokeStyle=INK;ctx.lineWidth=m*0.005;
  ctx.beginPath();ctx.moveTo(-m*0.016,0);ctx.lineTo(m*0.016,0);ctx.stroke();
  ctx.restore();

    ctx.beginPath();ctx.arc(twx,twy-m*0.145,m*0.007,0,TAU);ctx.fill();
  }
  // windsock shows the breeze
  const wsx=m*0.07,wsy=L.gy+2;
  ctx.strokeStyle=INK;ctx.lineWidth=Math.max(2,m*0.007);

  ctx.beginPath();ctx.moveTo(0,-m*0.012);ctx.lineTo(m*0.055*(0.35+Math.abs(wk)*0.65+0.15),-m*0.005);

  ctx.strokeStyle=INK;ctx.lineWidth=m*0.004;ctx.stroke();
  ctx.restore();
  // butterflies by day, fireflies by night
  for(const bf of butterflies){
    const flap=Math.sin(tSec*12+bf.ph);
    ctx.save();ctx.translate(bf.x,bf.y);
    ctx.rotate(Math.sin(tSec*2+bf.ph)*0.3);
    ctx.fillStyle='hsl('+bf.hue+',85%,70%)';
    ctx.strokeStyle=INK;ctx.lineWidth=1.2;
    ctx.beginPath();ctx.ellipse(-m*0.008,0,m*0.009,m*0.013*(0.4+0.6*Math.abs(flap)),-0.4,0,TAU);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.ellipse(m*0.008,0,m*0.009,m*0.013*(0.4+0.6*Math.abs(flap)),0.4,0,TAU);ctx.fill();ctx.stroke();
    ctx.fillStyle=INK;
    ctx.beginPath();ctx.ellipse(0,0,m*0.0035,m*0.008,0,0,TAU);ctx.fill();
    ctx.restore();
  }
  for(const ff of fireflies){
    const gl=0.4+0.6*Math.abs(Math.sin(tSec*2.4+ff.ph))+ff.pop;

    ctx.fillStyle='rgba(235,255,170,'+(0.85*gl)+')';
    ctx.beginPath();ctx.arc(ff.x,ff.y,m*0.005,0,TAU);ctx.fill();
  }
}
function drawStation(){
  if(freeMode||!cfg||!cfg.stationType)return;
  const st=L.station,w=L.pl*0.95,serving=units.some(u=>u.mode==='serving');
  const pulse=stationPulse>0?0.5+0.5*Math.sin(tSec*8):0;
  if(stationPulse>0){
    ctx.strokeStyle='rgba(255,210,63,'+(0.4+0.5*pulse)+')';
    ctx.lineWidth=m*0.01;
    ctx.beginPath();ctx.roundRect(st.x-w*0.9,st.y-L.rh*1.5,w*1.8,L.rh*2.2,m*0.03);ctx.stroke();
  }
  ctx.lineJoin='round';
  if(cfg.stationType==='wash'){
    // wash arch straddling the runway
    ctx.strokeStyle=INK;ctx.lineWidth=Math.max(3,m*0.012);
    ctx.beginPath();
    ctx.moveTo(st.x-w*0.62,st.y+L.rh*0.55);
    ctx.lineTo(st.x-w*0.62,st.y-L.rh*1.15);
    ctx.lineTo(st.x+w*0.62,st.y-L.rh*1.15);
    ctx.lineTo(st.x+w*0.62,st.y+L.rh*0.55);
    ctx.stroke();
    ctx.strokeStyle='#4cc3ff';ctx.lineWidth=Math.max(2,m*0.008);
    ctx.beginPath();ctx.moveTo(st.x-w*0.62,st.y-L.rh*1.15);ctx.lineTo(st.x+w*0.62,st.y-L.rh*1.15);ctx.stroke();
    for(const sx of[-0.36,0,0.36]){
      ctx.save();ctx.translate(st.x+w*sx,st.y-L.rh*0.35);
      ctx.rotate(serving?tSec*9:tSec*0.7);
      ctx.fillStyle='rgba(120,200,255,.65)';
      for(let i=0;i<5;i++){
        ctx.rotate(TAU/5);
        ctx.beginPath();ctx.ellipse(m*0.014,0,m*0.013,m*0.006,0,0,TAU);ctx.fill();
      }
      ctx.restore();
    }

    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('🫧',st.x,st.y-L.rh*1.45);
  }else{
    // fuel pump beside the runway
    const px=st.x-w*0.75,py=st.y-L.rh*0.15;
    ctx.fillStyle='#e03a2f';ctx.strokeStyle=INK;ctx.lineWidth=Math.max(2,m*0.008);
    ctx.beginPath();ctx.roundRect(px-m*0.025,py-m*0.08,m*0.05,m*0.085,m*0.012);ctx.fill();ctx.stroke();
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.roundRect(px-m*0.016,py-m*0.068,m*0.032,m*0.026,m*0.006);ctx.fill();
    ctx.fillStyle='#e03a2f';
    ctx.beginPath();ctx.arc(px,py-m*0.055,m*0.008,0,TAU);ctx.fill();
    const srv=units.find(u=>u.mode==='serving');
    ctx.strokeStyle='#3c4650';ctx.lineWidth=m*0.007;
    ctx.beginPath();ctx.moveTo(px+m*0.02,py-m*0.05);
    if(srv)ctx.quadraticCurveTo((px+srv.x)/2,py-m*0.1,srv.x-L.pl*srv.scale*0.3,srv.y-L.pl*srv.scale*0.05);

    ctx.stroke();
    ctx.font=(m*0.038)+'px system-ui,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('⛽',px,py-m*0.115);
  }
}

function faceEye(p,l,x,y,r){

  if(p.flipT>0)ctx.scale(Math.max(0.22,1-p.flipT/0.18),1);
  ctx.rotate(p.tilt*p.face);
  const wg=p.wig>0?Math.sin(p.wig*30)*0.12:0;
  ctx.rotate(wg);
  const wr=p.wrongT>0?Math.sin(p.wrongT*30)*0.25:0;
  ctx.scale(1+p.squash*0.5+(wr>0?0.12:0),1-p.squash*0.4-(wr>0?0.12:0));
  ctx.lineJoin='round';ctx.lineCap='round';
  if(p.veh==='heli')shapeHeliV(p,l);
  else if(p.veh==='balloon')shapeBalloonV(p,l);
  else if(p.veh==='rocket')shapeRocketV(p,l);
  else if(p.veh==='dragon')shapeDragonV(p,l);
  else shapePlaneV(p,l);
  // mud splats on a plane that needs a wash
  if(p.dirt&&p.service==='wash'&&!ghost){
    const fade=p.mode==='serving'?clamp(1-p.t/2.0,0,1):1;
    ctx.globalAlpha=0.85*fade;
    ctx.fillStyle='#8a6642';
    for(const d of p.dirt){
      ctx.beginPath();ctx.ellipse(d.dx*l,d.dy*l,d.r*l,d.r*l*0.7,d.dx,0,TAU);ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  ctx.restore();
  ctx.globalAlpha=1;
  // a little thought bubble showing what this one needs
  if(p.service&&!ghost&&p.mode!=='serving'&&!['waiting','gone'].includes(p.mode)){
    const bx=p.x+L.pl*p.scale*0.35,by=p.y-L.pl*p.scale*(p.veh==='balloon'?0.85:0.6);
    ctx.fillStyle='rgba(255,255,255,.92)';ctx.strokeStyle=INK;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(bx,by,m*0.032,0,TAU);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.arc(bx-m*0.026,by+m*0.028,m*0.007,0,TAU);ctx.fill();ctx.stroke();
    ctx.font=(m*0.036)+'px system-ui,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(p.service==='wash'?'🫧':'⛽',bx,by+1);
  }
}

const MAXLVL=12;
let furthest=store.get('lp2_lvl',1),level=Math.min(store.get('lp2_lvl',1),MAXLVL),
  finaleDone=store.get('lp2_fin',false),starsMap=store.get('lp2_stars',{});

let parts=[],popStars=[],floats=[],trail=[],hue=0,fwShells=[];
let lastTouch=-99,uidc=1,doneSaid=false;
function saveProgress(){store.set('lp2_lvl',furthest);store.set('lp2_fin',finaleDone);}
function unlockedVeh(n){return VEH.filter(k=>VEHUN[k]<=n);}
function newVehAt(n){return VEH.find(k=>VEHUN[k]===n)||null;}
function levelCfg(n){
  // every level delivers a set to arrange freely: some big+little colour
  // buddies, some singles, drawn from a 3-colour palette so colour
  // groupings are always possible
  const counts=[2,3,3,4,4,5,5,5,6,6,6,6];
  const total=n<=MAXLVL?counts[n-1]:5+(n%2);
  const maxAir=n<4?1:(n<8?2:3);
  const rng=makeRng(n*17+3);
  const avail=unlockedVeh(Math.min(n,MAXLVL));
  const fresh=n<=MAXLVL?newVehAt(n):null;
  const pal=[];
  while(pal.length<3){
    const c=Math.floor(rng()*PCOLS.length);
    if(!pal.includes(c))pal.push(c);
  }
  const list=[];
  const nPairs=Math.min(Math.floor(total/2),1+(n>=5?1:0)+(n>=10?1:0));
  for(let i=0;i<nPairs;i++){
    let veh=avail[Math.floor(rng()*avail.length)];
    if(fresh&&i===0)veh=fresh;
    const ci=pal[i%pal.length];
    list.push({veh,size:'big',ci});
    list.push({veh,size:'small',ci});
  }
  while(list.length<total){
    let veh=avail[Math.floor(rng()*avail.length)];
    if(fresh&&!list.some(u=>u.veh===fresh))veh=fresh;
    list.push({veh,size:rng()<0.5?'big':'small',ci:pal[Math.floor(rng()*pal.length)]});
  }
  // shuffle arrival order
  for(let i=list.length-1;i>0;i--){
    const j=Math.floor(rng()*(i+1));
    [list[i],list[j]]=[list[j],list[i]];
  }
  // from level 3 some aircraft ASK for a wash (odd levels) or fuel (even
  // levels) — a kind request, never a gate
  const stationType=n>=3?(n%2===1?'wash':'fuel'):null;
  let svc=0;
  if(stationType)list.forEach((u,i)=>{
    if(svc<Math.max(1,total-2)&&(i===0||rng()<0.35)){u.service=stationType;svc++;}
  });
  return{total,maxAir,list,arriveGap:n<5?3:4.2,rng,stationType};
}
let cfg=null;
function startLevel(){
  computeLayout();
  freeMode=false;
  themeIdx=(Math.min(level,MAXLVL)-1)%3;
  cfg=levelCfg(level);
  units=[];bays=[];queue=[];parked=0;doneSaid=false;
  trail=[];parts=[];popStars=[];floats=[];fwShells=[];
  // build roster then bays (shuffled order)
  cfg.list.forEach((u,i)=>{
    const p=makeUnit(u.veh,u.size,u.ci);
    p.order=i;
    if(u.service)giveService(p,u.service,cfg.rng);
    units.push(p);queue.push(p);
  });
  activeSigs=new Set();clearPend=-1;
  buildCritters();
  A.mus.theme=themeIdx;
  arriveT=0.8;
  stateG='intro';stateT=0;
}
function makeUnit(veh,size,ci){
  const bs=size==='big'?1.26:0.8;
  return{id:uidc++,veh,size,ci:ci%PCOLS.length,scale:bs,baseScale:bs,
    col:PCOLS[ci%PCOLS.length],x:-L.pl,y:H*0.3,px:0,py:0,vx:0,vy:0,
    gv:0,gvy:0,wheelRot:0,flipT:0,bounceY:0,bounceV:0,
    mode:'waiting',t:0,face:1,tilt:0,prop:rand(0,TAU),squash:0,wig:0,wheel:0,
    wrongT:0,band:0,crPh:rand(0,9),lookX:W,lookY:H*0.3,settle:null,
    winkAt:0,faceT:0,faceTo:null,
    service:null,dirt:null,blink:rand(2,6)};
}
function giveService(p,kind,rng){
  p.service=kind;
  if(kind==='wash'){
    p.dirt=[];
    for(let i=0;i<4;i++)p.dirt.push({dx:(rng()-0.5)*0.7,dy:(rng()-0.5)*0.28,r:0.07+rng()*0.06});
  }
}
// ------------- free arrangement: Oscar decides where everything goes.
// The game only notices what he builds and celebrates it.
let activeSigs=new Set(),clearPend=-1,lastFound=new Map();
function settledUnits(){return units.filter(u=>u.mode==='settled');}
function scanArrangements(fire){
  const S=settledUnits();
  const found=new Map();
  const near=(a,b)=>dist(a.x,a.y,b.x,b.y)<L.pl*(a.scale+b.scale)*0.95+m*0.03;
  // rows of neighbours → lines and size-orders
  const rows=[];
  for(const u of S){
    let r=rows.find(rr=>Math.abs(rr.y-u.y)<L.pl*0.5);
    if(!r){r={y:u.y,items:[]};rows.push(r);}
    r.items.push(u);
    r.y=(r.y*(r.items.length-1)+u.y)/r.items.length;
  }
  for(const r of rows){
    r.items.sort((a,b)=>a.x-b.x);
    let chain=[r.items[0]];
    const flush=()=>{
      if(chain.length>=3){
        const ids=chain.map(u=>u.id).sort((a,b)=>a-b).join(',');
        found.set('line:'+ids,{type:'line',us:chain.slice()});
        const sc=chain.map(u=>u.scale);
        const asc=sc.every((v,i)=>i===0||v>=sc[i-1]-0.01);
        const desc=sc.every((v,i)=>i===0||v<=sc[i-1]+0.01);
        if((asc||desc)&&new Set(chain.map(u=>u.size)).size>1)
          found.set('order:'+ids,{type:'order',us:chain.slice(),asc});
      }
    };
    for(let i=1;i<r.items.length;i++){
      const a=chain[chain.length-1],b=r.items[i];
      if(b.x-a.x<L.pl*(a.scale+b.scale)*1.25+m*0.04)chain.push(b);
      else{flush();chain=[b];}
    }
    flush();
  }
  // big+little colour buddies parked together
  for(let i=0;i<S.length;i++)for(let j=i+1;j<S.length;j++){
    const a=S[i],b=S[j];
    if(a.ci===b.ci&&a.veh===b.veh&&a.size!==b.size&&dist(a.x,a.y,b.x,b.y)<L.pl*2.1)
      found.set('buddy:'+Math.min(a.id,b.id)+','+Math.max(a.id,b.id),{type:'buddy',us:[a,b]});
  }
  // colour clusters (connected groups of the same colour)
  const comp=new Map();let cc=0;
  for(const u of S)comp.set(u.id,-1);
  for(const u of S){
    if(comp.get(u.id)!==-1)continue;
    const stack=[u];comp.set(u.id,cc);
    while(stack.length){
      const v=stack.pop();
      for(const w of S)if(comp.get(w.id)===-1&&near(v,w)){comp.set(w.id,cc);stack.push(w);}
    }
    cc++;
  }
  const byCC=new Map();
  for(const u of S){
    const k=comp.get(u.id)+':'+u.ci;
    if(!byCC.has(k))byCC.set(k,[]);
    byCC.get(k).push(u);
  }
  for(const[,us]of byCC){
    if(us.length<2)continue;
    const totalCol=units.filter(u=>u.ci===us[0].ci&&u.mode!=='gone').length;
    const full=us.length===totalCol;
    if(us.length>=3||(full&&us.length>=2)){
      const ids=us.map(u=>u.id).sort((a,b)=>a-b);
      if(us.length===2&&found.has('buddy:'+ids.join(',')))continue;
      found.set('col:'+us[0].ci+':'+ids.join(','),{type:'col',us:us.slice(),full});
    }
  }
  if(fire)for(const[sig,ev]of found)if(!activeSigs.has(sig))fireArrangement(ev);
  activeSigs=new Set(found.keys());
  lastFound=found;
  return found;
}
function fireArrangement(ev){
  if(ev.type==='line'){
    ev.us.forEach((u,i)=>{
      u.winkAt=tSec+i*0.13;
      A.tone(A.pent[Math.min(i,A.pent.length-1)],{t:i*0.13,dur:.3,v:.18});
      setTimeoutSafe(()=>sparkleAt(u.x,u.y-L.pl*u.scale*0.5,5),i*130);
    });
  }else if(ev.type==='order'){
    const us=ev.us.slice();
    us.forEach((u,i)=>{
      const rank=ev.asc?i:us.length-1-i;
      A.xylo(1+rank,i*0.14);
      u.winkAt=tSec+i*0.14;
      setTimeoutSafe(()=>floats.push({x:u.x,y:u.y-L.pl*u.scale*0.75,txt:'♪',t:0,col:'#8fe3ff'}),i*140);
    });
  }else if(ev.type==='buddy'){
    const[a,b]=ev.us;
    a.faceTo=b;b.faceTo=a;a.faceT=b.faceT=1.8;
    A.beepbeep();
    const mx=(a.x+b.x)/2,my=Math.min(a.y,b.y)-L.pl*0.7;
    for(let i=0;i<5;i++)parts.push({kind:'heart',x:mx+rand(-1,1)*L.pl*0.3,
      y:my+rand(-1,1)*L.pl*0.15,vx:rand(-14,14),vy:rand(-m*0.14,-m*0.06),
      r:m*0.014*rand(0.8,1.4),t:-i*0.1,life:1.2});
  }else if(ev.type==='col'){
    let cx=0,cy=0;
    for(const u of ev.us){cx+=u.x;cy+=u.y;}
    cx/=ev.us.length;cy/=ev.us.length;
    A.pop();A.babble(3);
    const col=ev.us[0].col[0];
    const n=ev.full?26:14;
    for(let i=0;i<n;i++)parts.push({kind:'conf',x:cx+rand(-1,1)*L.pl,
      y:cy-L.pl*0.6,vx:rand(-m*0.22,m*0.22),vy:rand(-m*0.45,-m*0.12),
      r:rand(3,6),rot:rand(0,TAU),vr:rand(-6,6),t:0,life:rand(0.8,1.4),col});
  }
}
const pendingTOs=[];
function setTimeoutSafe(fn,ms){pendingTOs.push(setTimeout(fn,ms));}

// ------------------------------------------------------------- free fly mode
function startFree(){
  freeMode=true;themeIdx=0;A.mus.theme=0;
  cfg=null;bays=[];units=[];queue=[];parked=0;
  trail=[];parts=[];popStars=[];floats=[];fwShells=[];
  buildCritters();
  const uv=unlockedVeh(Math.min(furthest,MAXLVL));
  const p=makeUnit(uv[Math.floor(Math.random()*uv.length)],'big',Math.floor(Math.random()*6));
  p.scale=1;p.mode='enter';p.x=-L.pl;p.y=H*0.28;
  units.push(p);

// ------------------------------------------------------------- update
let grabs=new Map(); // pointerId -> unit id
function airborneCount(){return units.filter(p=>['enter','cruise','follow'].includes(p.mode)).length;}
function update(dt){
  tSec+=dt;stateT+=dt;
  updateAmbient(dt);
  if(stateG==='title'||stateG==='map'){updateFx(dt);return;}
  if(stateG==='intro'){
    updateFx(dt);
    if(stateT>((level<=MAXLVL&&newVehAt(level))?2.8:1.5)){stateG='play';stateT=0;}
    return;
  }
  if(stateG==='clear'){
    if(Math.random()<dt*3)fireworkAt(rand(W*0.2,W*0.8),rand(H*0.12,L.gy*0.6));
    for(const p of units){p.t+=dt;p.squash=Math.abs(Math.sin(p.t*7))*0.2;p.prop+=dt*30;}
    updateFx(dt);
    if(stateT>3){
      if(level>MAXLVL&&!finaleDone){finaleDone=true;saveProgress();stateG='finale';stateT=0;
        A.bigWin();say('You did it, Oscar! Amazing flying!');}
      else{stateG='done';stateT=0;
        say('Well done, Oscar! Three stars!');
        document.getElementById('nextBtn').style.display='block';}
    }
    return;
  }
  if(stateG==='finale'){
    if(Math.random()<dt*2.5)fireworkAt(rand(W*0.15,W*0.85),rand(H*0.1,L.gy*0.6));
    updateFx(dt);
    if(stateT>6)document.getElementById('nextBtn').style.display='block';
    return;
  }
  if(stateG==='done'){updateFx(dt);return;}
  if(stateG!=='play')return;
  // arrivals
  if(!freeMode&&queue.length&&airborneCount()<cfg.maxAir){
    arriveT-=dt;
    if(arriveT<=0){
      const p=queue.shift();
      p.mode='enter';
      p.band=airborneCount()%3;
      p.x=-L.pl*p.scale;p.y=L.gy*(0.22+p.band*0.17);
      A.whoosh();
      arriveT=cfg.arriveGap;
    }
  }
  if(freeMode&&units.every(p=>p.mode==='gone')&&units.length){
    units=[];
    const uv=unlockedVeh(Math.min(furthest,MAXLVL));
    const p=makeUnit(uv[Math.floor(Math.random()*uv.length)],'big',Math.floor(Math.random()*6));
    p.scale=1;p.mode='enter';p.x=-L.pl;p.y=H*0.28;
    units.push(p);A.whoosh();
  }
  for(const p of units)updateUnit(p,dt);
  updateFx(dt);
  parked=settledUnits().length;
  // engine hum follows the fastest ground speed
  let esp=0;
  for(const u of units)if(u.mode==='drag'||u.mode==='rolling')esp=Math.max(esp,Math.abs(u.gv));
  A.setEngine(esp/(m*0.95));
  // completion: everyone home and settled, wherever Oscar put them
  if(clearPend>0){
    clearPend-=dt;
    if(clearPend<=0){
      if(!freeMode&&units.length&&queue.length===0&&
         units.every(p=>p.mode==='settled'||p.mode==='gone')){
        stateG='clear';stateT=0;
        starsMap[level]=3;store.set('lp2_stars',starsMap);
        level++;
        furthest=Math.max(furthest,level);
        saveProgress();
        A.fanfare();vib([30,60,30]);
        // the celebration echoes what he actually built
        const echo=[...lastFound.values()].slice(0,3);
        echo.forEach((ev,i)=>setTimeoutSafe(()=>fireArrangement(ev),900+i*750));
      }
      clearPend=-1;
    }
  }
}
function updateUnit(p,dt){
  const pl=L.pl*p.scale;
  const pr=p.veh==='heli'?1.6:1;
  const grounded=['drag','rolling','settling','settled','serving','taxiout'].includes(p.mode);
  p.prop+=dt*pr*(p.mode==='follow'||p.mode==='enter'?30:p.mode==='cruise'?20:p.mode==='glide'?26:grounded?6+Math.abs(p.gv)*0.05:14);
  if(p.flipT>0)p.flipT-=dt;
  if(p.faceT>0){p.faceT-=dt;if(p.faceT<=0)p.faceTo=null;}
  if(p.winkAt&&tSec>=p.winkAt){p.blink=0.11;p.winkAt=0;}
  if(p.wig>0)p.wig-=dt;
  if(p.wrongT>0)p.wrongT-=dt;
  p.blink-=dt;
  if(p.blink<-0.02)p.blink=rand(2.5,6.5);
  p.px=p.x;p.py=p.y;
  const fingerP=p.fing;
  if(p.mode==='waiting')return;
  if(p.mode==='enter'){
    p.x+=m*0.3*dt;
    if(p.x>W*0.3){p.mode='cruise';p.t=0;}
  }else if(p.mode==='cruise'){
    p.t+=dt;
    const tx=W*(0.5+0.27*Math.sin(p.t*0.20+p.crPh));
    const ty=L.gy*(0.22+p.band*0.17)+L.gy*0.06*Math.sin(p.t*0.5+p.crPh);
    p.x+=(tx-p.x)*Math.min(1,1.2*dt)+wind*dt*0.6;
    p.y+=(ty-p.y)*Math.min(1,1.2*dt);
    p.wheel=Math.max(0,p.wheel-dt*2);
  }else if(p.mode==='follow'){
    if(!fingerP){p.mode='cruise';p.t=rand(0,9);return;}
    const ease=p.veh==='balloon'?4.5:p.veh==='rocket'?9.5:p.veh==='heli'?6.5:7.5;
    const tx=clamp(fingerP.x,pl*0.45,W-pl*0.45);
    const ty=clamp(fingerP.y,pl*0.5,L.planeY);
    p.x+=(tx-p.x)*Math.min(1,ease*dt)+wind*dt;
    p.y+=(ty-p.y)*Math.min(1,ease*dt);
    if(p.y>L.gy-pl*0.9)p.wheel=Math.min(1,p.wheel+dt*4);
    if(p.y>=L.planeY-2){
      p.gv=clamp(p.vx,-m*0.8,m*0.8);
      doTouchdown(p,Math.abs(p.vy));
      if(p.fing)p.mode='drag';
    }
    // rainbow trail
    if(Math.hypot(p.x-p.px,p.y-p.py)>1.5){
      hue=(hue+430*dt)%360;
      trail.push({x:p.x,y:p.y,t:0,h:hue});
      if(trail.length>90)trail.shift();
    }
    if(p.veh==='rocket'&&Math.hypot(p.vx,p.vy)>m*0.12){
      parts.push({kind:'spark',x:p.x-p.face*pl*0.55,y:p.y+pl*0.04,
        vx:-p.face*m*0.18+rand(-20,20),vy:rand(-10,30),r:rand(3,6),t:0,life:0.3,
        col:Math.random()<0.5?'#ff9d2e':'#ffd23f'});
    }
  }else if(p.mode==='glide'){
    // hands off: the aircraft brings itself in — glide, flare, touch down
    const gvT=p.veh==='heli'?0:(p.veh==='balloon'?m*0.12:Math.max(m*0.26,Math.abs(p.gv)));
    p.gv+=(gvT*p.face-p.gv)*Math.min(1,1.6*dt);
    if(p.x<pl*0.8&&p.face<0){p.face=1;p.flipT=0.18;}
    if(p.x>W-pl*0.8&&p.face>0){p.face=-1;p.flipT=0.18;}
    const dy=L.planeY-p.y;
    let vyT=clamp(dy*1.1,m*0.1,m*0.55);
    if(p.veh==='balloon')vyT=Math.min(vyT,m*0.16);
    if(p.veh==='heli')vyT=Math.min(vyT,m*0.26);
    p.flare=dy<pl*0.9?1:0;
    if(p.flare)vyT=Math.min(vyT,m*0.13);
    p.gvy+=(vyT-p.gvy)*Math.min(1,3*dt);
    p.x+=p.gv*dt+wind*dt;
    p.y+=p.gvy*dt;
    if(dy<pl*1.3)p.wheel=Math.min(1,p.wheel+dt*3.5);
    if(p.y>=L.planeY)doTouchdown(p,p.gvy);
  }else if(p.mode==='drag'){
    if(!fingerP){release(p);return;}
    if(fingerP.y<L.gy-pl*0.9){p.mode='follow';p.gv=0;p.gvy=0;A.whoosh();return;}
    // driving, not sliding: accelerate toward the finger, flip to face travel
    const tx=clamp(fingerP.x,pl*0.4,W-pl*0.4);
    const ty=clamp(fingerP.y,L.planeY-2,H-pl*0.35);
    const vmax=m*(p.veh==='balloon'?0.55:0.95),acc=m*3.2;
    const want=clamp((tx-p.x)*6,-vmax,vmax);
    p.gv+=clamp(want-p.gv,-acc*dt,acc*dt);
    if(p.flipT<=0){
      if(p.gv>m*0.1&&p.face<0){p.face=1;p.flipT=0.18;}
      else if(p.gv<-m*0.1&&p.face>0){p.face=-1;p.flipT=0.18;}
    }
    p.x+=p.gv*dt;
    p.y+=(ty-p.y)*Math.min(1,4*dt);
    p.wheel=1;
    p.wheelRot+=p.gv/(pl*0.11)*dt;
    if(Math.abs(p.gv)>m*0.4&&Math.random()<dt*10)
      parts.push({kind:'dust',x:p.x-Math.sign(p.gv)*pl*0.45,y:p.y+pl*0.18,
        vx:rand(-20,20)-p.gv*0.15,vy:rand(-30,-8),r:rand(3,6),t:0,life:0.5,col:'rgba(255,255,255,.55)'});
  }else if(p.mode==='rolling'){
    // momentum: rolls on after touchdown or a push, then eases to a stop
    p.gv*=Math.exp(-1.7*dt);
    p.gv-=Math.sign(p.gv)*Math.min(Math.abs(p.gv),m*0.16*dt);
    p.x+=p.gv*dt;
    if(p.x<pl*0.5){p.x=pl*0.5;p.gv=Math.abs(p.gv)*0.4;p.face=1;p.flipT=0.18;A.clunk();}
    if(p.x>W-pl*0.5){p.x=W-pl*0.5;p.gv=-Math.abs(p.gv)*0.4;p.face=-1;p.flipT=0.18;A.clunk();}
    p.wheelRot+=p.gv/(pl*0.11)*dt;
    if(p.bounceV!==0||p.bounceY>0){
      p.bounceY+=p.bounceV*dt;
      p.bounceV-=m*2.4*dt;
      if(p.bounceY<=0){
        p.bounceY=0;
        p.bounceV=p.bounceV<-m*0.15?-p.bounceV*0.35:0;
        if(p.bounceV===0)p.squash=Math.max(p.squash,0.25);
      }
    }
    p.y+=(L.planeY-p.y)*Math.min(1,8*dt);
    if(Math.abs(p.gv)>m*0.35&&Math.random()<dt*8)
      parts.push({kind:'dust',x:p.x-Math.sign(p.gv)*pl*0.45,y:p.y+pl*0.18,
        vx:rand(-16,16),vy:rand(-24,-6),r:rand(3,6),t:0,life:0.5,col:'rgba(255,255,255,.55)'});
    if(Math.abs(p.gv)<m*0.045&&p.bounceY<=0&&p.bounceV===0)beginSettle(p);
  }else if(p.mode==='settling'){
    p.t+=dt;
    const k=Math.min(1,p.t/0.3),e=k*k*(3-2*k);
    p.x=lerp(p.settle.fx,p.settle.tx,e);
    p.y=lerp(p.settle.fy,p.settle.ty,e);
    p.wheel=1;
    if(p.t>=0.3){
      p.mode='settled';p.squash=0.32;
      A.clunk();vib(8);
      sparkleAt(p.x,p.y-pl*0.4,4);
      scanArrangements(true);
      checkAllSettled();
    }
  }else if(p.mode==='settled'){
    p.wheel=1;p.gv=0;
  }else if(p.mode==='serving'){
    p.t+=dt;
    const st=L.station;
    p.x+=(st.x-p.x)*Math.min(1,8*dt);
    p.y+=(st.y-p.y)*Math.min(1,8*dt);
    p.wheel=1;p.face=1;
    p.wig=0.1;
    if(cfg&&cfg.stationType==='wash'){
      if(Math.random()<dt*16)parts.push({kind:'spark',
        x:p.x+rand(-1,1)*L.pl*p.scale*0.5,y:p.y+rand(-0.4,0.1)*L.pl*p.scale,
        vx:rand(-20,20),vy:rand(-50,-16),r:rand(3,6),t:0,life:rand(0.5,0.9),col:'rgba(160,220,255,.9)'});
      if(Math.random()<dt*4)A.scrub();
    }else{
      if(((p.t*3)|0)!==(((p.t-dt)*3)|0))A.glug();
    }
    if(p.t>2.2){
      p.service=null;p.dirt=null;p.t=0;p.squash=0.4;
      p.mode='rolling';p.gv=m*0.34;p.face=1;p.flipT=0;
      A.babble(4);A.ding();
      sparkleAt(p.x,p.y-L.pl*p.scale*0.4,12);
      floats.push({x:p.x,y:p.y-L.pl*p.scale*0.8,
        txt:cfg&&cfg.stationType==='wash'?'ALL CLEAN!':'FULL TANK!',t:0,col:'#8fe3ff'});
    }
  }else if(p.mode==='taxiout'){
    p.t+=dt;p.face=1;p.wheel=1;
    p.x+=m*0.5*dt;
    p.y+=(groundYFor(p)-p.y)*Math.min(1,6*dt);
    if(p.x>W+pl)p.mode='gone';
  }
  // velocity estimate (air) + facing + tilt + eyes
  const nvx=(p.x-p.px)/Math.max(dt,1e-4),nvy=(p.y-p.py)/Math.max(dt,1e-4);
  p.vx=p.vx*0.8+nvx*0.2;p.vy=p.vy*0.8+nvy*0.2;
  if(p.mode==='follow'||p.mode==='cruise'){
    if(p.vx>m*0.06)p.face=1;else if(p.vx<-m*0.06)p.face=-1;
  }
  const airborne=['enter','cruise','follow','glide'].includes(p.mode);
  let wantTilt=airborne?clamp(p.vy*0.0022,-0.4,0.4):clamp(p.gv*0.0005,-0.1,0.1);
  if(p.mode==='glide'&&p.flare)wantTilt=-0.22;
  p.tilt+=(wantTilt-p.tilt)*Math.min(1,8*dt);
  p.squash=Math.max(0,p.squash-dt*1.8);
  if(p.faceTo){p.face=p.faceTo.x>=p.x?1:-1;p.lookX=p.faceTo.x;p.lookY=p.faceTo.y;}
  else if(fingerP){p.lookX=fingerP.x;p.lookY=fingerP.y;}
  else{p.lookX=p.x+p.face*120;p.lookY=p.y;}
}
function groundYFor(p){return L.planeY;}
function doTouchdown(p,impactVy){
  p.y=L.planeY;p.wheel=1;p.flare=0;
  const iv=Math.abs(impactVy||m*0.2);
  if(p.veh==='balloon')p.gv*=0.3;
  else if(p.veh==='heli')p.gv*=0.4;
  else if(Math.abs(p.gv)<m*0.3)p.gv=m*0.34*(p.face||1);
  p.mode='rolling';p.t=0;p.squash=0.4;
  if(iv>m*0.22){p.bounceV=iv*0.3;p.bounceY=0.01;}
  const k=clamp((Math.abs(p.gv)+iv)/(m*0.9),0,1);
  A.thud();
  if(p.veh!=='balloon'&&p.veh!=='dragon')A.screech(k);
  vib(12);
  for(let i=0;i<7;i++)parts.push({kind:'dust',x:p.x+rand(-1,1)*L.pl*p.scale*0.45,
    y:L.planeY+L.pl*p.scale*0.18,vx:rand(-m*0.12,m*0.12),vy:rand(-m*0.07,0),
    r:rand(4,9),t:0,life:0.5,col:'rgba(255,255,255,.7)'});
}
function celebrateFree(p){
  A.fanfare();
  for(let i=0;i<26;i++)parts.push({kind:'conf',x:p.x+rand(-L.pl,L.pl)*0.6,
    y:p.y-rand(0,L.pl*0.8),vx:rand(-m*0.25,m*0.25),vy:rand(-m*0.5,-m*0.15),
    r:rand(3,6),rot:rand(0,TAU),vr:rand(-6,6),t:0,life:rand(0.9,1.5),
    col:['#ff5a5f','#ffd23f','#4cc3ff','#4be3a4','#c9a0ff','#ff8ac2'][i%6]});
  for(let i=0;i<4;i++)popStars.push({x:p.x+(i-1.5)*L.pl*0.4,y:p.y-L.pl*0.6,t:-i*0.07});
  setTimeoutSafe(()=>{if(p.mode==='settled')p.mode='taxiout';},1700);
}
function beginSettle(p){
  const pl=L.pl*p.scale;
  let tx=clamp(p.x,pl*0.55,W-pl*0.55),ty=clamp(p.y,L.planeY,H-pl*0.4);
  // a helping hand: line up with the nearest neighbour's row
  let bestN=null,bd=1e9;
  for(const u of settledUnits()){
    if(u===p)continue;
    const d=Math.abs(u.x-p.x);
    if(Math.abs(u.y-ty)<pl*0.55&&d<pl*3&&d<bd){bd=d;bestN=u;}
  }
  if(bestN&&Math.abs(bestN.y-ty)<=pl*0.4)ty=bestN.y;
  // and ease off anything we half-stopped on
  for(let it=0;it<4;it++){
    let moved=false;
    for(const u of settledUnits()){
      if(u===p)continue;
      const minG=L.pl*(p.scale+u.scale)*0.62;
      if(Math.abs(u.y-ty)<pl*0.5&&Math.abs(u.x-tx)<minG){
        tx=u.x+(tx>=u.x?1:-1)*minG;
        moved=true;
      }
    }
    if(!moved)break;
  }
  tx=clamp(tx,pl*0.55,W-pl*0.55);
  p.settle={fx:p.x,fy:p.y,tx,ty};
  p.mode='settling';p.t=0;p.gv=0;
}
function checkAllSettled(){
  if(freeMode){
    const p=units.find(u=>u.mode==='settled');
    if(p)celebrateFree(p);
    return;
  }
  if(!cfg)return;
  if(queue.length===0&&units.every(u=>u.mode==='settled'||u.mode==='gone'))clearPend=0.7;
}
function release(p){
  p.fing=null;
  if(p.mode==='follow'){
    // let go in the air → the plane lands itself, worth watching
    p.mode='glide';
    p.gvy=Math.max(m*0.08,Math.abs(p.vy)*0.4);
    p.gv=clamp(p.vx,-m*0.7,m*0.7);
    if(Math.abs(p.gv)>m*0.08)p.face=p.gv>0?1:-1;
    return;
  }
  if(p.mode!=='drag')return;
  if(p.service&&cfg&&cfg.stationType){
    const st=L.station,pl=L.pl*p.scale;
    if(Math.abs(p.x-st.x)<pl*1.0&&Math.abs(p.y-st.y)<L.rh*1.4){
      p.mode='serving';p.t=0;p.gv=0;
      A.whoosh();
      return;
    }
  }
  p.mode='rolling'; // keeps its momentum and rolls on like a toy car
}
function sparkleAt(x,y,n){
  for(let i=0;i<(n||7);i++){
    const a=rand(0,TAU),v=rand(m*0.06,m*0.3);
    parts.push({kind:'spark',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,
      r:rand(2.5,5),t:0,life:rand(0.35,0.7),
      col:['#fff','#ffd23f','#ff8ac2','#8fe3ff','#c9ffa0'][i%5]});
  }
}
function fireworkAt(x,y){
  const col=['#ff5a5f','#ffd23f','#4cc3ff','#4be3a4','#c9a0ff','#ff8ac2'][(Math.random()*6)|0];
  A.pop();
  for(let i=0;i<20;i++){
    const a=i*TAU/20,v=rand(m*0.14,m*0.3);
    parts.push({kind:'spark',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,
      r:rand(2.5,4.5),t:0,life:rand(0.6,1),col});
  }
}
function updateAmbient(dt){
  for(const st of stars)if(st.tw>0)st.tw=Math.max(0,st.tw-dt);
  stationPulse=Math.max(0,stationPulse-dt);
  // breeze from level 8 up — the windsock shows it
  wind=(!freeMode&&stateG==='play'&&level>=8)?
    Math.sin(tSec*0.32)*m*0.038*Math.min(1,(level-7)*0.5):wind*0.95;
  if(Math.abs(wind)>m*0.02&&Math.random()<dt*2.5)
    parts.push({kind:'spark',x:wind>0?-8:W+8,y:rand(L.gy*0.2,L.gy*0.9),
      vx:wind*3.2,vy:rand(-8,14),r:rand(2,3.5),t:0,life:rand(1.2,2),col:'rgba(180,230,120,.75)'});
  for(const bf of butterflies){
    bf.x+=Math.sin(tSec*0.9+bf.ph)*m*0.05*dt*(bf.dash>0?5:1);
    bf.y+=Math.cos(tSec*1.3+bf.ph*1.7)*m*0.04*dt*(bf.dash>0?4:1);
    bf.x=clamp(bf.x,m*0.04,W-m*0.04);bf.y=clamp(bf.y,m*0.06,L.gy*0.95);
    if(bf.dash>0)bf.dash-=dt;
  }
  for(const ff of fireflies){
    ff.x+=Math.sin(tSec*0.7+ff.ph)*m*0.03*dt;
    ff.y+=Math.cos(tSec*0.9+ff.ph*2.1)*m*0.025*dt;
    if(ff.pop>0)ff.pop-=dt*2;
  }
  for(const c of clouds){
    c.x+=c.v*dt;
    if(c.bT<9)c.bT+=dt;
    if(c.x-c.s*1.6>W){c.x=-c.s*1.6;c.y=rand(H*0.04,L.gy*0.5);}
  }
  for(const f of flowers)if(f.popT<9)f.popT+=dt;
  sunG=Math.max(0,sunG-dt);
  nextBirds-=dt;
  if(nextBirds<=0){
    nextBirds=rand(16,30);
    const fromLeft=Math.random()<0.5;
    const by=rand(H*0.06,L.gy*0.45);
    for(let i=0;i<3;i++)birds.push({
      x:fromLeft?-m*0.05-i*m*0.06:W+m*0.05+i*m*0.06,
      y:by+(i-1)*m*0.03,
      vx:(fromLeft?1:-1)*m*rand(0.1,0.14),ph:rand(0,TAU),loopT:0});
  }
  for(const b of birds){
    b.x+=b.vx*dt;
    if(b.loopT>0){b.loopT-=dt;b.y+=Math.sin(b.loopT*12)*m*0.15*dt;}
  }
  birds=birds.filter(b=>b.x>-m*0.3&&b.x<W+m*0.3);
  for(const b of bays)if(b.pulse>0)b.pulse-=dt;
  for(const q of trail)q.t+=dt;
  while(trail.length&&trail[0].t>0.9)trail.shift();
}
function updateFx(dt){
  for(const q of parts){
    q.t+=dt;q.x+=(q.vx||0)*dt;q.y+=(q.vy||0)*dt;
    if(q.kind==='conf'){q.vy+=m*0.9*dt;q.rot+=q.vr*dt;}
  }
  parts=parts.filter(q=>q.t<q.life);
  for(const st of popStars)st.t+=dt;
  popStars=popStars.filter(st=>st.t<1.2);
  for(const f of floats)f.t+=dt;
  floats=floats.filter(f=>f.t<1.1);
}

// ------------------------------------------------------------- drawing
function starPath(c,r){
  c.beginPath();
  for(let i=0;i<10;i++){
    const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*0.45:r;
    i===0?c.moveTo(Math.cos(a)*rr,Math.sin(a)*rr):c.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);
  }
  c.closePath();
}
function drawBays(){
  for(const b of bays){
    const u=units.find(p=>p.id===b.unit);
    const pulse=b.pulse>0?0.5+0.5*Math.sin(tSec*8):0;
    ctx.fillStyle=b.filled?'rgba(255,255,255,.28)':'rgba(255,255,255,.16)';
    ctx.strokeStyle=b.pulse>0?'rgba(255,210,63,'+(0.5+0.5*pulse)+')':(b.filled?'rgba(255,255,255,.9)':'rgba(255,255,255,.75)');
    ctx.lineWidth=Math.max(2.5,m*0.007)*(b.pulse>0?1.8:1);
    if(!b.filled)ctx.setLineDash([m*0.018,m*0.014]);
    ctx.beginPath();ctx.roundRect(b.x-b.w/2,b.y-b.h,b.w,b.h*1.28,m*0.02);ctx.fill();ctx.stroke();
    ctx.setLineDash([]);
    if(!b.filled&&u){
      // ghost of who parks here (toy-box cut-out)
      const saveXY={x:u.x,y:u.y,lx:u.lookX,ly:u.lookY,f:u.face,ti:u.tilt,sq:u.squash,wg:u.wig,wr:u.wrongT,wh:u.wheel};
      u.x=b.x;u.y=b.y-L.pl*u.scale*0.18;u.lookX=b.x+120;u.lookY=u.y;
      u.face=1;u.tilt=0;u.squash=0;u.wig=0;u.wrongT=0;u.wheel=1;
      drawUnit(u,true);
      Object.assign(u,{x:saveXY.x,y:saveXY.y,lookX:saveXY.lx,lookY:saveXY.ly,
        face:saveXY.f,tilt:saveXY.ti,squash:saveXY.sq,wig:saveXY.wg,wrongT:saveXY.wr,wheel:saveXY.wh});
    }
    if(b.filled){
      // little flag pops up on a full space
      ctx.save();ctx.translate(b.x+b.w/2-m*0.015,b.y-b.h);
      ctx.strokeStyle=INK;ctx.lineWidth=m*0.006;
      ctx.beginPath();ctx.moveTo(0,m*0.02);ctx.lineTo(0,-m*0.045);ctx.stroke();
      ctx.fillStyle='#ffd23f';
      ctx.beginPath();ctx.moveTo(0,-m*0.045);ctx.lineTo(m*0.032,-m*0.033);ctx.lineTo(0,-m*0.021);ctx.closePath();ctx.fill();
      ctx.restore();
    }
  }
}
function drawTrail(){
  for(let i=1;i<trail.length;i++){
    const a=trail[i-1],b=trail[i];
    const age=b.t;
    if(age>0.8)continue;
    ctx.strokeStyle='hsla('+b.h+',95%,62%,'+(0.75*(1-age/0.8))+')';
    ctx.lineWidth=L.pl*0.14*(1-age/0.9);
    ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  }
}
function drawFxAll(){
  for(const q of parts){
    const k=1-q.t/q.life;
    if(k<=0)continue;
    ctx.globalAlpha=Math.min(1,k*2);
    if(q.kind==='spark'){
      ctx.fillStyle=q.col;
      ctx.beginPath();ctx.arc(q.x,q.y,q.r*k+1,0,TAU);ctx.fill();
    }else if(q.kind==='dust'){
      ctx.fillStyle=q.col;
      ctx.beginPath();ctx.arc(q.x,q.y,q.r*(1+q.t*2),0,TAU);ctx.fill();
    }else if(q.kind==='conf'){
      ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.rot);
      ctx.fillStyle=q.col;ctx.fillRect(-q.r,-q.r*0.6,q.r*2,q.r*1.2);
      ctx.restore();
    }else if(q.kind==='heart'){
      if(q.t>=0){
        ctx.save();ctx.translate(q.x,q.y);
        ctx.scale(q.r/10,q.r/10);
        ctx.beginPath();ctx.moveTo(0,3.4);
        ctx.bezierCurveTo(-6.6,-2.2,-3.4,-8.4,0,-4.2);
        ctx.bezierCurveTo(3.4,-8.4,6.6,-2.2,0,3.4);
        ctx.closePath();
        ctx.fillStyle='#ff6f91';ctx.fill();
        ctx.strokeStyle='#e0455f';ctx.lineWidth=1.2;ctx.stroke();
        ctx.restore();
      }
    }
    ctx.globalAlpha=1;
  }
  for(const st of popStars){
    if(st.t<0)continue;
    const k=st.t/1.2;
    if(k>=1)continue;
    const sc=k<0.25?k/0.25:1;
    ctx.save();
    ctx.translate(st.x,st.y-k*m*0.1);
    ctx.rotate(Math.sin(k*6)*0.2);
    ctx.scale(sc,sc);
    ctx.globalAlpha=1-Math.max(0,(k-0.6)/0.4);
    starPath(ctx,m*0.03);
    ctx.fillStyle='#ffd23f';ctx.fill();
    ctx.strokeStyle='#e8a512';ctx.lineWidth=2;ctx.stroke();
    ctx.restore();
    ctx.globalAlpha=1;
  }
  for(const f of floats){
    const k=f.t/1.1;
    ctx.globalAlpha=1-k*k;
    ctx.font='900 '+(m*0.042)+'px system-ui,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.lineWidth=m*0.012;ctx.strokeStyle='rgba(40,50,30,.7)';
    ctx.strokeText(f.txt,f.x,f.y-k*m*0.07);
    ctx.fillStyle=f.col;
    ctx.fillText(f.txt,f.x,f.y-k*m*0.07);
    ctx.globalAlpha=1;
  }
}
function drawHud(){
  if(freeMode)return;
  // level roundel
  const r=m*0.042,cx=W-r*1.7,cy=r*1.7;
  ctx.fillStyle='#e03a2f';ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(2.5,r*0.14);
  ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.fill();ctx.stroke();
  ctx.fillStyle='#fff';
  ctx.font='900 '+(r*1.1)+'px system-ui,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(Math.min(level,MAXLVL),cx,cy+r*0.05);
  // progress stars: one per aircraft parked
  const n=cfg?cfg.total:0;
  const gap=Math.min(m*0.07,W*0.6/Math.max(1,n));
  for(let i=0;i<n;i++){
    ctx.save();ctx.translate(W/2+(i-(n-1)/2)*gap,m*0.055);
    starPath(ctx,m*0.022);
    if(i<parked){ctx.fillStyle='#ffd23f';ctx.strokeStyle='#e8a512';}
    else{ctx.fillStyle='rgba(255,255,255,.32)';ctx.strokeStyle='rgba(255,255,255,.65)';}
    ctx.fill();ctx.lineWidth=2;ctx.stroke();
    ctx.restore();
  }
}
function drawHint(){
  if(stateG!=='play'||freeMode)return;
  if(tSec-lastTouch<5)return;
  const pulse=0.5+0.5*Math.sin(tSec*4);
  // 1) a plane waiting in the sky? point at it
  const air=units.find(p=>['cruise','enter'].includes(p.mode));
  const svcP=units.find(p=>p.mode==='settled'&&p.service);
  const target=air||svcP;
  if(!target)return;
  ctx.strokeStyle='rgba(255,255,255,'+(0.35+0.4*pulse)+')';
  ctx.lineWidth=4;
  ctx.beginPath();ctx.arc(target.x,target.y,L.pl*target.scale*(0.8+pulse*0.15),0,TAU);ctx.stroke();
  ctx.font=(m*0.06)+'px system-ui,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('👆',target.x+L.pl*0.7,target.y+L.pl*0.6);
  // a plane that would like a wash or fuel: gentle dashed path to the station
  if(svcP&&cfg&&cfg.stationType){
    stationPulse=Math.max(stationPulse,0.2);
    ctx.strokeStyle='rgba(255,255,255,'+(0.3+0.35*pulse)+')';
    ctx.lineWidth=m*0.008;
    ctx.setLineDash([m*0.02,m*0.016]);
    ctx.beginPath();
    ctx.moveTo(svcP.x,svcP.y+L.pl*0.3);
    ctx.quadraticCurveTo((svcP.x+L.station.x)/2,Math.min(svcP.y,L.station.y)-m*0.04,
      L.station.x,L.station.y-L.rh*0.8);
    ctx.stroke();
    ctx.setLineDash([]);
  }
}
function drawBanner(){
  ctx.fillStyle='rgba(40,60,30,.45)';
  ctx.fillRect(0,H*0.30,W,H*0.34);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='900 '+(m*0.1)+'px system-ui,sans-serif';
  ctx.lineWidth=m*0.02;ctx.strokeStyle='#2c521e';
  const title=level>MAXLVL?'FREE PLAY!':'LEVEL '+level;
  ctx.strokeText(title,W/2,H*0.40);
  ctx.fillStyle='#fff';
  ctx.fillText(title,W/2,H*0.40);
  const nv=level<=MAXLVL?newVehAt(level):null;
  if(nv){
    ctx.font='800 '+(m*0.042)+'px system-ui,sans-serif';
    ctx.fillStyle='#ffd23f';
    ctx.strokeStyle='rgba(40,50,30,.8)';ctx.lineWidth=m*0.012;
    ctx.strokeText('SOMEONE NEW IS COMING!',W/2,H*0.49);
    ctx.fillText('SOMEONE NEW IS COMING!',W/2,H*0.49);
    const k=clamp(stateT/2.8,0,1);
    const fake=makeUnit(nv,'big',level%6);
    fake.x=lerp(-m*0.2,W+m*0.2,k);fake.y=H*0.58;
    fake.lookX=fake.x+120;fake.lookY=fake.y;fake.prop=tSec*30;
    drawUnit(fake,false);
  }
}
function drawDone(){
  ctx.fillStyle='rgba(40,60,30,.5)';
  ctx.fillRect(0,0,W,H);
  const cw=Math.min(W*0.86,m*0.95),ch=H*0.5,cx=W/2,cy=H*0.40;
  ctx.fillStyle='#fff8ea';ctx.strokeStyle='#e8a512';ctx.lineWidth=m*0.012;
  ctx.beginPath();ctx.roundRect(cx-cw/2,cy-ch/2,cw,ch,m*0.04);ctx.fill();ctx.stroke();
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='900 '+(m*0.062)+'px system-ui,sans-serif';
  ctx.fillStyle='#e03a2f';
  ctx.fillText('WELL DONE',cx,cy-ch*0.36);
  ctx.fillText('OSCAR!',cx,cy-ch*0.21);
  for(let i=0;i<3;i++){
    const pop=clamp((stateT-0.3-i*0.25)*3,0,1);
    ctx.save();ctx.translate(cx+(i-1)*m*0.12,cy+ch*0.02);
    ctx.scale(pop,pop);ctx.rotate((1-pop)*2);
    starPath(ctx,m*0.05);
    ctx.fillStyle='#ffd23f';ctx.fill();
    ctx.strokeStyle='#e8a512';ctx.lineWidth=3;ctx.stroke();
    ctx.restore();
  }
  ctx.font='800 '+(m*0.036)+'px system-ui,sans-serif';
  ctx.fillStyle='#2c521e';
  ctx.fillText('EVERYONE PARKED JUST HOW YOU LIKE!',cx,cy+ch*0.22);
  const nv=level<=MAXLVL?newVehAt(level):null;
  if(nv){
    ctx.fillStyle='#e8862c';
    ctx.fillText('NEXT: SOMEONE NEW!',cx,cy+ch*0.34);
  }
}
function drawFinale(){
  ctx.fillStyle='rgba(40,60,30,.35)';
  ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='900 '+(m*0.095)+'px system-ui,sans-serif';
  ctx.lineWidth=m*0.02;ctx.strokeStyle='#2c521e';
  ctx.strokeText('YOU DID IT',W/2,H*0.18);
  ctx.fillStyle='#ffd23f';
  ctx.fillText('YOU DID IT',W/2,H*0.18);
  ctx.strokeText('OSCAR!',W/2,H*0.29);
  ctx.fillText('OSCAR!',W/2,H*0.29);
  ctx.font=(m*0.13)+'px system-ui,sans-serif';
  ctx.fillText('🏆',W/2,H*0.42);
  const k=(stateT*0.1)%1.4;
  VEH.forEach((v,i)=>{
    const fake=makeUnit(v,'big',i);
    fake.x=((k+i*0.2)%1.4)*(W+m*0.6)-m*0.3;
    fake.y=H*0.58+Math.sin(tSec*4+i)*m*0.012;
    fake.lookX=fake.x+120;fake.lookY=fake.y;fake.prop=tSec*30;
    drawUnit(fake,false);
  });
}
function mapNodes(){
  const cols=W>H?4:3,rows=Math.ceil(MAXLVL/cols);
  const mx=W*0.15,my=H*0.22,gw=(W-mx*2)/(cols-1),gh=(H*0.58)/Math.max(1,rows-1);
  const nodes=[];
  for(let n=1;n<=MAXLVL;n++){
    const r=((n-1)/cols)|0;
    let c=(n-1)%cols;
    if(r%2===1)c=cols-1-c;
    nodes.push({n,x:mx+c*gw,y:my+r*gh});
  }
  return nodes;
}
function drawMap(){
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='900 '+(m*0.052)+'px system-ui,sans-serif';
  ctx.lineWidth=m*0.014;ctx.strokeStyle='#2c521e';
  ctx.strokeText('PICK A LEVEL',W/2,H*0.09);
  ctx.fillStyle='#fff';
  ctx.fillText('PICK A LEVEL',W/2,H*0.09);
  const nodes=mapNodes();
  ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=m*0.009;
  ctx.setLineDash([m*0.014,m*0.018]);
  ctx.beginPath();
  nodes.forEach((nd,i)=>{i===0?ctx.moveTo(nd.x,nd.y):ctx.lineTo(nd.x,nd.y);});
  ctx.stroke();ctx.setLineDash([]);
  for(const nd of nodes){
    const unlocked=nd.n<=furthest,current=nd.n===furthest&&furthest<=MAXLVL;
    const bob=current?Math.abs(Math.sin(tSec*3))*m*0.012:0;
    const r=m*0.05*(current?1.3:1);
    ctx.save();ctx.translate(nd.x,nd.y-bob);
    ctx.globalAlpha=unlocked?1:0.45;
    ctx.fillStyle='#fff';
    ctx.beginPath();
    ctx.arc(-r*0.55,0,r*0.6,0,TAU);ctx.arc(r*0.55,0,r*0.58,0,TAU);
    ctx.arc(0,-r*0.32,r*0.7,0,TAU);ctx.arc(0,r*0.2,r*0.62,0,TAU);
    ctx.fill();
    if(current){
      ctx.strokeStyle='#ffd23f';ctx.lineWidth=m*0.009;
      ctx.beginPath();ctx.arc(0,0,r*1.28,0,TAU);ctx.stroke();
    }
    ctx.fillStyle=unlocked?'#2c521e':'#9aa7b5';
    ctx.font='900 '+(r*0.95)+'px system-ui,sans-serif';
    ctx.fillText(nd.n,0,r*0.05);
    ctx.restore();
    ctx.globalAlpha=1;
    if(starsMap[nd.n])for(let i=0;i<3;i++){
      ctx.save();ctx.translate(nd.x+(i-1)*m*0.028,nd.y+m*0.072);
      starPath(ctx,m*0.012);
      ctx.fillStyle='#ffd23f';ctx.fill();
      ctx.strokeStyle='#e8a512';ctx.lineWidth=1.2;ctx.stroke();
      ctx.restore();
    }
  }
  if(finaleDone){
    ctx.font=(m*0.06)+'px system-ui,sans-serif';
    ctx.fillText('🏆',W/2,H*0.925);
  }
}
function drawTitle(){
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='900 '+(m*0.05)+'px system-ui,sans-serif';
  ctx.fillStyle='#2c521e';
  ctx.fillText("OSCAR'S",W/2,H*0.13);
  ctx.font='900 '+(m*0.095)+'px system-ui,sans-serif';
  ctx.lineWidth=m*0.02;ctx.strokeStyle='#2c521e';
  ctx.strokeText('LITTLE PILOT',W/2,H*0.21);
  ctx.fillStyle='#fff';
  ctx.fillText('LITTLE PILOT',W/2,H*0.21);
  const bob=Math.abs(Math.sin(tSec*3))*m*0.018;
  const hero=makeUnit('plane','big',0);
  hero.x=W/2;hero.y=H*0.40-bob;hero.scale=1.7;
  hero.lookX=W/2+150;hero.lookY=hero.y;hero.prop=tSec*30;
  drawUnit(hero,false);
  const ub=unlockedVeh(Math.min(furthest,MAXLVL));
  const gap=Math.min(m*0.17,W/(ub.length+1));
  ub.forEach((k,i)=>{
    const u=makeUnit(k,'small',i+1);
    u.x=W/2+(i-(ub.length-1)/2)*gap;u.y=H*0.58;u.scale=0.8;
    u.lookX=u.x+120;u.lookY=u.y;u.prop=tSec*(20+i);
    drawUnit(u,false);
  });
  ctx.font='700 '+(m*0.034)+'px system-ui,sans-serif';
  ctx.fillStyle='rgba(44,82,30,.85)';
  ctx.fillText(furthest>MAXLVL?'ALL DONE! 🏆 KEEP FLYING!':'Level '+Math.min(furthest,MAXLVL)+' of '+MAXLVL,W/2,H*0.67);
}
function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  drawScene();
  if(stateG==='title'){drawTitle();drawFxAll();return;}
  if(stateG==='map'){drawMap();drawFxAll();return;}
  drawStation();
  drawTrail();
  // ground units back-to-front, then airborne on top
  const ground=units.filter(p=>!['enter','cruise','follow','glide','waiting','gone'].includes(p.mode));
  ground.sort((a,b)=>a.y-b.y);
  const air=units.filter(p=>['enter','cruise','follow','glide'].includes(p.mode));
  for(const p of ground)drawUnit(p,false);
  for(const p of air)drawUnit(p,false);
  drawFxAll();
  drawHud();
  drawHint();
  if(stateG==='intro')drawBanner();
  else if(stateG==='done')drawDone();
  else if(stateG==='finale')drawFinale();
}

// ------------------------------------------------------------- input
let fsTried=false,everTouched=false;
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  A.resume();
  everTouched=true;lastTouch=tSec;
  if(!fsTried){fsTried=true;
    const d=document.documentElement;
    if(d.requestFullscreen&&!(matchMedia('(display-mode: fullscreen)').matches||matchMedia('(display-mode: standalone)').matches))d.requestFullscreen().catch(()=>{});
    try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{});}catch(err){}
    try{if('speechSynthesis'in window)speechSynthesis.getVoices();}catch(err){}}
  A.musicOn(themeIdx);
  const x=e.clientX,y=e.clientY;
  sparkleAt(x,y,5);
  if(stateG==='map'){
    for(const nd of mapNodes()){
      if(dist(x,y,nd.x,nd.y)<m*0.078){
        if(nd.n<=furthest){
          A.pop();level=nd.n;
          playBtn.style.display=freeBtn.style.display=resetBtn.style.display=nextBtn.style.display='none';
          startLevel();
        }else{A.uhoh();}
        return;
      }
    }
    return;
  }
  if(stateG!=='play')return;
  // grab nearest touchable unit
  let best=null,bd=1e9;
  for(const p of units){
    if(['waiting','gone','settling','serving'].includes(p.mode))continue;
    const r=L.pl*p.scale*1.1;
    const d=dist(x,y,p.x,p.y);
    if(d<r&&d<bd){bd=d;best=p;}
  }
  if(best){
    grabs.set(e.pointerId,best.id);
    best.fing={x,y};
    const wasGround=!['enter','cruise','follow','glide'].includes(best.mode);
    if(!wasGround){best.mode='follow';trail=[];}
    else{best.mode='drag';}
    best.wig=0.25;
    if(wasGround)A.babble();
    else if(best.veh==='dragon')A.roarF();
    else if(best.veh==='balloon')A.bell();
    else if(best.veh==='heli')A.brrr();
    else if(best.veh==='rocket')A.zoom();
    else A.honk();
    return;
  }
  // playful props
  const s=L.sun;
  let hitProp=false;
  if(dist(x,y,s.x,s.y)<s.r*1.6){sunG=0.9;A.giggle();hitProp=true;}
  for(const b of birds)if(dist(x,y,b.x,b.y)<m*0.06){b.loopT=0.8;A.chirp();hitProp=true;}
  if(!hitProp)for(const bf of butterflies){
    if(dist(x,y,bf.x,bf.y)<m*0.06){bf.dash=0.9;A.chirp();hitProp=true;break;}
  }
  if(!hitProp)for(const ff of fireflies){
    if(dist(x,y,ff.x,ff.y)<m*0.065){ff.pop=1;A.note();hitProp=true;break;}
  }
  if(!hitProp)for(const c of clouds){
    if(Math.abs(x-c.x)<c.s*1.5&&Math.abs(y-c.y)<c.s*0.95){
      c.bT=0;A.patter();hitProp=true;
      for(let i=0;i<8;i++)parts.push({kind:'spark',x:c.x+rand(-c.s,c.s),y:c.y+c.s*0.6,
        vx:rand(-m*0.02,m*0.02),vy:m*0.14,r:rand(3,5),t:0,life:1,col:'#6fc3f2'});
      break;
    }
  }
  if(!hitProp&&themeIdx===2)for(const st of stars){
    if(dist(x,y,st.x,st.y)<m*0.07){st.tw=1;A.note();hitProp=true;break;}
  }
  if(!hitProp)for(const f of flowers){
    if(dist(x,y,f.x,f.y-f.s*1.4)<Math.max(30,f.s*2.2)&&f.popT>1){
      f.popT=0;A.pop();hitProp=true;
      for(let i=0;i<7;i++){
        const a=i*TAU/7;
        parts.push({kind:'spark',x:f.x,y:f.y-f.s*1.4,
          vx:Math.cos(a)*m*0.12,vy:Math.sin(a)*m*0.12-m*0.05,
          r:f.s*0.4,t:0,life:0.8,col:f.col});
      }
      break;
    }
  }
  if(!hitProp)A.note();
});
addEventListener('pointermove',e=>{
  const id=grabs.get(e.pointerId);
  if(id===undefined)return;
  const p=units.find(u=>u.id===id);
  if(p&&p.fing){p.fing.x=e.clientX;p.fing.y=e.clientY;}
});
function endPointer(e){
  const id=grabs.get(e.pointerId);
  grabs.delete(e.pointerId);
  if(id===undefined)return;
  const p=units.find(u=>u.id===id);
  if(p)release(p);
}
addEventListener('pointerup',endPointer);
addEventListener('pointercancel',endPointer);
document.addEventListener('contextmenu',e=>e.preventDefault());

// ------------------------------------------------------------- flow / buttons
const playBtn=document.getElementById('playBtn'),nextBtn=document.getElementById('nextBtn');
const muteBtn=document.getElementById('mute'),resetBtn=document.getElementById('resetBtn'),
  freeBtn=document.getElementById('freeBtn');
function showTitle(){
  stateG='title';stateT=0;freeMode=false;
  themeIdx=0;A.mus.theme=0;units=[];bays=[];cfg=null;
  buildCritters();
  playBtn.textContent=(furthest>1?'CONTINUE ':'PLAY ')+'▶';
  playBtn.style.display='block';
  freeBtn.style.display='block';
  resetBtn.style.display=furthest>1?'block':'none';
  resetBtn.textContent='start over';
  nextBtn.style.display='none';
}
function showMap(){
  stateG='map';stateT=0;freeMode=false;
  themeIdx=0;A.mus.theme=0;units=[];bays=[];cfg=null;
  buildCritters();
  playBtn.style.display='none';nextBtn.style.display='none';
  freeBtn.style.display='block';
  resetBtn.style.display='none';
}
playBtn.addEventListener('click',()=>{
  A.resume();A.honk();
  playBtn.style.display='none';freeBtn.style.display='none';resetBtn.style.display='none';
  showMap();
});
nextBtn.addEventListener('click',()=>{
  A.resume();A.pop();
  nextBtn.style.display='none';
  showMap();
});
freeBtn.addEventListener('pointerdown',e=>e.stopPropagation());
freeBtn.addEventListener('click',()=>{
  A.resume();A.whoosh();
  playBtn.style.display='none';freeBtn.style.display='none';resetBtn.style.display='none';
  startFree();
});
muteBtn.addEventListener('pointerdown',e=>e.stopPropagation());
muteBtn.addEventListener('click',()=>{A.resume();A.setMute(!A.muted);muteBtn.textContent=A.muted?'🔇':'🔊';});
muteBtn.textContent=A.muted?'🔇':'🔊';
let resetArm=false;
resetBtn.addEventListener('pointerdown',e=>e.stopPropagation());
resetBtn.addEventListener('click',()=>{
  if(!resetArm){resetArm=true;resetBtn.textContent='tap again to reset';
    setTimeout(()=>{resetArm=false;resetBtn.textContent='start over';},2500);return;}
  furthest=1;level=1;finaleDone=false;starsMap={};
  store.set('lp2_stars',{});saveProgress();
  resetArm=false;showTitle();A.uhoh();
});
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden){try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{});}catch(e){}}
});

// installable-app support (no-op when opened as a plain file)
if('serviceWorker'in navigator&&location.protocol.indexOf('http')===0){
  addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});
}

// ------------------------------------------------------------- loop
let last=performance.now();
function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(t-last)/1000);
  last=t;
  A.musicTick();
  if(stateG!=='play')A.setEngine(0);
  update(dt*warp);
  render();
}
resize();
addEventListener('resize',resize);
showTitle();
requestAnimationFrame(frame);

window.__LP={
  state:()=>stateG,level:()=>level,units:()=>units,parked:()=>parked,
  sigs:()=>[...activeSigs],
  furthest:()=>furthest,stars:()=>starsMap,station:()=>L.station,
  warp:k=>{warp=k;},grant:n=>{furthest=n;level=Math.min(n,MAXLVL);saveProgress();},
  gotoLevel:n=>{level=n;
    playBtn.style.display=freeBtn.style.display=resetBtn.style.display=nextBtn.style.display='none';
    startLevel();},
  play:()=>{playBtn.click();},next:()=>{nextBtn.click();},free:()=>{freeBtn.click();}
};
</script>
